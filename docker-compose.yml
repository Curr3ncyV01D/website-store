services:
  # =========================================
  # 1. POSTGRES DATABASE (основная БД)
  # =========================================
  db:
    image: postgres:15-alpine
    container_name: yupoo_db
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-yupoo_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-yupoo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =========================================
  # 2. WEB-ИНТЕРФЕЙС (FastAPI + Jinja2)
  #    Публичный порт 80 -> внутренний 8000
  # =========================================
  web:
    build: .
    container_name: yupoo_web
    restart: always
    tty: true
    # Автозапуск миграций Alembic при старте (если есть Alembic в проекте):
    # command: >
    #   bash -c "
    #   alembic upgrade head || true ;
    #   uvicorn src.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    #   "
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    expose:
      - "8000"
    env_file:
      # порядок важен: общие из .env, затем переопределения из .env.prod (если файл есть)
      # ВНИМАНИЕ: для запуска на сервере скопируй .env.prod в .env
      - .env
    volumes:
      # Persistent storage: кэш картинок Telegram CDN (не пропадает при docker compose down)
      - ./data:/app/data
      # Статика (PhotoSwipe v5, no-image placeholder)
      - ./static:/app/static
      # Шаблоны (если захочешь править html без пересборки образа)
      - ./templates:/app/templates
    depends_on:
      db:
        condition: service_healthy

  # =========================================
  # 3. BACKGROUND WORKER (Telegram CDN → DB)
  #    Скачивает альбомы, кэширует картинки, пишет в БД
  # =========================================
  worker:
    build: .
    restart: always
    tty: true
    command: python scripts/run_worker.py --interval 1.5
    env_file:
      - .env
    volumes:
      # Разделяем с web ОДИН И ТОТ ЖЕ кэш: что скачал worker, сразу отдаёт web
      - ./data:/app/data
      # Статика (no-image fallback) тоже доступна worker'у
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: yupoo_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
    driver: local
  caddy_data:
  caddy_config:
