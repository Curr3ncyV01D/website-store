<!doctype html>
<html lang="ru">
<head>
  {% include "components/head.html" %}
</head>
<body
  x-data="searchLock()"
  @search-open.window="_searchOpen = true; _updateLock()"
  @search-close.window="_searchOpen = false; _updateLock()"
  @resize.window="_updateLock()"
  class="bg-bg text-ink font-sans antialiased min-h-screen"
  :class="{ 'overflow-hidden': searchLocked }"
>

{% set initial_query = query|default("", true) %}

{% include "components/header.html" %}
{% include "components/menu_drawer.html" %}

<main class="max-w-[1400px] mx-auto px-4 sm:px-6 pt-2 md:pt-6 pb-6 md:pb-10">
  {% block content %}{% endblock %}
</main>

{% include "components/footer.html" %}

<script defer src="/static/js/search.js"></script>
<script defer src="/static/js/menu.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
